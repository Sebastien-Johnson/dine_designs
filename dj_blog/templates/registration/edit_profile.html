{% extends "base.html" %}
{% if object.author.id == request.user.id%}
    {% block title %}Edit Profile{% endblock %}
    {% block content %}


    <h1>Edit Profile...</h1>
    {{ user.profile.bio }}
    <div class="form-group">
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button class="btn btn-secondary">Update Profile</button>
        </form>
        <form method="get">
            <button type="submit", formaction="{% url 'post_list' %}">Return Home</button>
        </form>
    </div>
    {% endblock %}
{% else %}
    <h2>Only account owners can edit their pages!</h2>
    <form method="get">
        <button type="submit", formaction="{% url 'post_list' %}">Return Home</button>
    </form>
{% endif %}
