{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<h2>Log In</h2>

<div>
	<form method="POST" >
		{% csrf_token %}
		{{ form }}
		<button type="submit">Log In</button>
	</form>
</div><br>

<div class="form-group">

	<h5>New? Sign up!

		<form method="GET">
			<button type="submit", formaction="{% url 'signup' %}">Signup</button>
		</form>

	</h5>

</div><br>


<div class="form-group">

	<form method="GET">
		<button type="submit", formaction="{% url 'recipe_list' %}">Return Home</button>
	</form>

</div>

{% endblock %}
