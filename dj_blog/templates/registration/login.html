{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2>Log In</h2>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <button type="submit">Log In</button>
</form>
<p>New? Sign up</p>
<form method="get">
  <button type="submit", formaction="{% url 'signup' %}">Signup</button>
</form>
<p>Admins</p>
<form method="get">
  <button type="submit", formaction="/admin">Admin Portal</button>
</form>
{% endblock %}
