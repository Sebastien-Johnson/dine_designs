{% if request.user.is_authenticated %}

  {% block title %}Recipe Creation{% endblock %}

  {% block content %}
  <h2>Create Recipe</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Recipe</button>
  </form>
  {% endblock %}
{% else %}
  <p>Please login to create new recipes</p>
  <form method="get">
    <button type="submit", formaction="{% url 'log_auth' %}">Login/Signup</button>
  </form>
{% endif %}
