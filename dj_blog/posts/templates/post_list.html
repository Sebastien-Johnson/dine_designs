{% if user.is_authenticated %}
  <p>Account: {{user.username}}</p>
  <form action="{% url 'edit_account' %}" method="get">
    {% csrf_token %}
  <button type="submit">Edit Account</button>
  </form>
  <form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Log Out</button>
  </form>
{% else %}
  <form method="get">
    <button type="submit", formaction="{% url 'log_auth' %}">Login/Signup</button>
  </form>
{% endif %}
<h1>Recipe List</h1>
<form method="get">
  <button type="submit", formaction="{% url 'post_create' %}">Create Recipe</button>
</form>
{% for post in object_list  %}
<div>
  <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
  <p>{{ post.description }}</p>
</div>
{% endfor %}
