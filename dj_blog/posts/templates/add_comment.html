{% if request.user.is_authenticated %}

  {% block title %}Comment on post{% endblock %}

  {% block content %}
  <h2>Add Comment</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Post</button>
    </form>
    
    <form method="get">
    <button type="submit", formaction="{% url 'post_list' %}">Return Home</button>
    </form>
  {% endblock %}
{% else %}
  <p>Please login to create new recipes</p>
  <form method="get">
    <button type="submit", formaction="{% url 'log_auth' %}">Login/Signup</button>
  </form>
{% endif %}
