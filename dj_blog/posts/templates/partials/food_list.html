<div class="d-flex justify-content-between">

<section class="col-6">
{% if foods %}
{% csrf_token %}
<ul class="list=group col-4">
{% for food in foods %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ food.name }}
        <span class="badge badge-danger badge-pill"
            style="cursor: pointer;"
            hx-post="{% url 'delete_food' food.pk %}"
            hx-target="#food_list"
            hx-confirm="Confirm Delete?">X</span>
    </li>
{% endfor %}
</ul>
{% else %}
    <p>You do not have any ingredients in your list</p>
{% endif %}
</section>

<section>
    {% include 'partials/search.html' %}
</section>
