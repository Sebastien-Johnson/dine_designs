{% if request.user.is_authenticated %}

  {% block title %}Recipe Creation{% endblock %}

  {% block content %}
  <h2>Edit Recipe</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save</button>
    </form>
    
    <script>
      var name = "{{user.id}}";
      document.getElementById("author_name_field").value = name;
    </script>
    <form method="get">
    <button type="submit", formaction="{% url 'post_list' %}">Return Home</button>
    </form>
  {% endblock %}
{% else %}
  <p>Please login to edit recipes</p>
  <form method="get">
    <button type="submit", formaction="{% url 'log_auth' %}">Login/Signup</button>
  </form>
{% endif %}
