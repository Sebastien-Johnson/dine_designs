{% if foods %}
    <!-- selectable drop down list -->
    <select
        id="food-select"
        name="fdc_id"
        size="8"
        class="form-control"
    >
        {% for food in foods %}
            <option value="{{ food.fdcId }}">
                {{ food.description.title }}, {{ food.brandName.title }}
            </option>
        {% endfor %}
    </select>

    <!-- takes selected food and creates with "add_food" view -->
    <button
        type="button"
        class="btn btn-success mt-2"
        hx-post="{% url 'add_food' %}"
        hx-include="#food-select"
        hx-target="#food_list"
        hx-swap="innerHTML"
    >
        Add Ingredient
    </button>

{% elif request.GET.foodname %}
    <p>No foods found.</p>
{% endif %}
