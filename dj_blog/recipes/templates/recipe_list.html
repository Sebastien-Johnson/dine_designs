{% extends "base.html" %}

{% block title %}Recipe Feed{% endblock %}

{% block content %}

	<h2>Recent Recipes</h2>

	<form method="GET">
		<button type="submit", formaction="{% url 'recipe_create' %}">Create Recipe</button>
	</form>
{% if object_list %}

	{% for recipe in object_list  %}

		<div>
			<h2><a href="{% url 'recipe_detail' recipe.pk %}">{{ recipe.title }}</a></h2>
		</div>

	{% endfor %}

{% endif %}

{% endblock %}
